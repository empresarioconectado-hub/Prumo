name: Android Build and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Gerar AAB assinado (requer secrets de assinatura configurados)"
        required: true
        default: false
        type: boolean

concurrency:
  group: prumo-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bootstrap Gradle Wrapper
        run: |
          GRADLE_VERSION="$(grep -oE 'gradle-[0-9.]+-bin.zip' gradle/wrapper/gradle-wrapper.properties | sed 's/gradle-//; s/-bin.zip//')"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Não foi possível identificar a versão do Gradle em gradle/wrapper/gradle-wrapper.properties."
            exit 1
          fi
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          chmod +x ./gradlew

      - name: Run unit tests
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-configuration-cache testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Dependência indisponível; nova tentativa $((attempt + 1))/3."
              sleep $((attempt * 20))
            fi
          done
          exit 1

      - name: Run Android lint
        run: ./gradlew --no-configuration-cache lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prumo-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate debug signing keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: ./gradlew --no-configuration-cache assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prumo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests on Android emulator
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bootstrap Gradle Wrapper
        run: |
          GRADLE_VERSION="$(grep -oE 'gradle-[0-9.]+-bin.zip' gradle/wrapper/gradle-wrapper.properties | sed 's/gradle-//; s/-bin.zip//')"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Não foi possível identificar a versão do Gradle."
            exit 1
          fi
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          chmod +x ./gradlew

      - name: Generate debug signing keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            for attempt in 1 2 3; do
              if ./gradlew --no-configuration-cache connectedDebugAndroidTest; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Falha transitória nos testes instrumentados; nova tentativa em 15 segundos."
                sleep 15
              fi
            done
            exit 1

  release-bundle:
    name: Build signed release bundle
    if: github.event_name == 'workflow_dispatch' && inputs.build_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Bootstrap Gradle Wrapper
        run: |
          GRADLE_VERSION="$(grep -oE 'gradle-[0-9.]+-bin.zip' gradle/wrapper/gradle-wrapper.properties | sed 's/gradle-//; s/-bin.zip//')"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Não foi possível identificar a versão do Gradle."
            exit 1
          fi
          curl --fail --location --retry 3 "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin
          chmod +x ./gradlew

      - name: Prepare production signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Configure RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD e RELEASE_KEY_PASSWORD nas secrets do repositório."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prumo-upload-key.jks"
          test -s "$RUNNER_TEMP/prumo-upload-key.jks"

      - name: Build signed Android App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/prumo-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: prumo-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
